name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: brief
          POSTGRES_PASSWORD: brief
          POSTGRES_DB: brief_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U brief" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://brief:brief@localhost:5432/brief_ci_unused
      TEST_DATABASE_URL: postgresql://brief:brief@localhost:5432/brief_test
      APP_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
