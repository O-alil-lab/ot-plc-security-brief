# Render Blueprint: https://render.com/docs/blueprint-spec
# Deploys the web app from the Dockerfile and redeploys on every push to main.
# Background work (feed polling, newsletter sending, KEV sync) is triggered by
# .github/workflows/cron.yml calling POST /api/cron, because Render's free plan
# has no background workers or cron jobs.
services:
  - type: web
    name: ot-plc-security-brief
    runtime: docker
    plan: free
    branch: main
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    dockerCommand: npm run start:hosted
    healthCheckPath: /api/health
    envVars:
      # PostgreSQL connection string (e.g. from Neon). Entered by you in Render; never committed.
      - key: DATABASE_URL
        sync: false
      # Generated by Render. Used to hash tokens and IPs.
      - key: APP_SECRET
        generateValue: true
      # Generated by Render. Copy it into the GitHub repo secret CRON_SECRET.
      - key: CRON_SECRET
        generateValue: true
      # First admin, created on start only if no admin exists.
      # The password is generated by Render: reveal it in the Environment tab, sign in, then delete it there.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: FETCH_USER_AGENT
        value: "OT-PLC-Security-Brief/0.1 (+https://github.com/O-alil-lab/ot-plc-security-brief)"
      # Development email mode: messages appear in Admin > Dev mailbox, nothing is sent.
      # Switch to smtp or resend (and set EMAIL_FROM + credentials) before real sign-ups.
      - key: EMAIL_PROVIDER
        value: console
      # News agent writing. AI is used only when ANTHROPIC_API_KEY is set;
      # without it, stories use the publisher's own wording.
      - key: AI_PROVIDER
        value: anthropic
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: NODE_ENV
        value: production
